<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Voice2Sentimental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-md border border-gray-100 my-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-teal-100 text-teal-600 mb-4">
                <i class="fa-solid fa-user-plus text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Create an Account</h1>
            <p class="text-gray-500 text-sm mt-2">Join to start analyzing audio</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded mb-6 text-sm" role="alert">
            <p>{{ error }}</p>
        </div>
        {% endif %}
        
        {% if success %}
        <div class="bg-green-50 border-l-4 border-green-500 text-green-700 p-4 rounded mb-6 text-sm" role="alert">
            <p>{{ success }}</p>
        </div>
        {% endif %}

        <form method="POST" action="/register" class="space-y-5">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2" for="username">Username</label>
                <input class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 transition outline-none" id="username" name="username" type="text" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2" for="password">Password</label>
                <input class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 transition outline-none" id="password" name="password" type="password" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2" for="confirm_password">Confirm Password</label>
                <input class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 transition outline-none" id="confirm_password" name="confirm_password" type="password" required>
            </div>
            <button class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md mt-4" type="submit">
                Register
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-600 mt-8">
            Already have an account? <a href="/login" class="text-teal-600 hover:underline font-semibold">Sign in here</a>
        </p>
    </div>
</body>
</html>
